name: Pokemon Poll

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install pandas

      - name: Atualizar enquete
        env:
          CSV_URL: ${{ secrets.LINK_PLANILHA }}
        run: |
          python python/LeitorDaPlanilha.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          git diff --staged --quiet || git commit -m "Atualiza enquete Pokémon"

          git push
